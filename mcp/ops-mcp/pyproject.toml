[project]
name = "ops"
version = "0.19.3"
description = "线上运维排查 MCP Server — 支持多环境、多实例的日志查询、应用监控、数据库查询"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]<2",
    "pyyaml",
]

[project.scripts]
ops = "ops.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ops"]
